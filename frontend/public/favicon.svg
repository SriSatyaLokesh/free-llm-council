<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E121E" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>
    <linearGradient id="c-blue" x1="16" y1="4" x2="16" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="c-purple" x1="5" y1="18" x2="12" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="c-emerald" x1="20" y1="18" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="c-spark" x1="13" y1="13" x2="19" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="c-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian squircle background badge with subtle perimeter rim -->
  <rect width="32" height="32" rx="7.5" fill="url(#c-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Neural council orbital filaments -->
  <path d="M16 8 C11 12 8 17 8 22" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 2" opacity="0.65" />
  <path d="M16 8 C21 12 24 17 24 22" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 2" opacity="0.65" />
  <path d="M8 22 C13 23.5 19 23.5 24 22" stroke="#8B5CF6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 2" opacity="0.65" />

  <!-- Synaptic convergence rays meeting at consensus hub -->
  <line x1="16" y1="8" x2="16" y2="15.5" stroke="#60A5FA" stroke-width="1" stroke-linecap="round" opacity="0.75" />
  <line x1="8" y1="22" x2="16" y2="15.5" stroke="#C084FC" stroke-width="1" stroke-linecap="round" opacity="0.75" />
  <line x1="24" y1="22" x2="16" y2="15.5" stroke="#34D399" stroke-width="1" stroke-linecap="round" opacity="0.75" />

  <!-- Node 1: Top AI Agent (Council Chairman) -->
  <circle cx="16" cy="8" r="3.2" fill="url(#c-blue)" />
  <circle cx="16" cy="8" r="1.2" fill="#FFFFFF" />

  <!-- Node 2: Bottom-Left AI Agent (Council Peer A) -->
  <circle cx="8" cy="22" r="3.2" fill="url(#c-purple)" />
  <circle cx="8" cy="22" r="1.2" fill="#FFFFFF" />

  <!-- Node 3: Bottom-Right AI Agent (Council Peer B) -->
  <circle cx="24" cy="22" r="3.2" fill="url(#c-emerald)" />
  <circle cx="24" cy="22" r="1.2" fill="#FFFFFF" />

  <!-- Central Consensus AI Spark / Decision Star -->
  <path d="M16 12 C16 14.3 14.3 15.5 12.5 15.5 C14.3 15.5 16 16.7 16 19 C16 16.7 17.7 15.5 19.5 15.5 C17.7 15.5 16 14.3 16 12 Z" fill="url(#c-spark)" filter="url(#c-glow)" />
</svg>
